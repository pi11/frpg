; Copy to /etc/pgbouncer/pgbouncer.ini. Passwords live only in /etc/pgbouncer/userlist.txt.
[databases]
; TCP, not the socket: local socket logins use `peer` by default and would be refused.
wasteland = host=127.0.0.1 port=5432 dbname=wasteland

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6432
unix_socket_dir =
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 200
default_pool_size = 20
logfile = /var/log/postgresql/pgbouncer.log
pidfile = /var/run/postgresql/pgbouncer.pid
