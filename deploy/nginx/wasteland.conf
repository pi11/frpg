server {
    # The old `http2` form also works on nginx 1.24 (Ubuntu 24.04).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name game.example.com;

    ssl_certificate /etc/letsencrypt/live/game.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/game.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:wl_tls:10m;

    access_log /var/log/nginx/wasteland.access.log wasteland;
    error_log /var/log/nginx/wasteland.error.log;

    root /srv/wasteland/web;
    client_max_body_size 64k;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    include snippets/wasteland-headers.conf;

    # --- API ---
    error_page 429 @rate_limited;
    location @rate_limited {
        internal;
        default_type application/json;
        include snippets/wasteland-headers.conf;
        add_header Access-Control-Allow-Origin $http_origin always;
        return 429 '{"code":"rate_limited","message":"Слишком много запросов. Подождите немного."}';
    }
    location = /api/v1/auth/guest {
        limit_req zone=wl_guest burst=10 nodelay;
        include snippets/wasteland-proxy.conf;
    }
    location /api/v1/auth/telegram/poll/ {
        limit_req zone=wl_poll burst=2 nodelay;
        include snippets/wasteland-proxy.conf;
    }
    location /api/v1/auth/ {
        limit_req zone=wl_auth burst=20 nodelay;
        include snippets/wasteland-proxy.conf;
    }
    # Updates come from few Telegram addresses: no per-IP limit, the secret header is checked.
    location = /api/v1/telegram/webhook { include snippets/wasteland-proxy.conf; }
    location /api/ {
        limit_req zone=wl_api burst=40 nodelay;
        include snippets/wasteland-proxy.conf;
    }
    location = /.well-known/assetlinks.json { include snippets/wasteland-proxy.conf; }

    # --- Static client ---
    # Vite puts hashed files right in /assets/; sprites, sounds and music live in subfolders.
    location ~ "^/assets/[^/]+-[A-Za-z0-9_-]{8}\.(js|css|woff2?)$" {
        include snippets/wasteland-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location /assets/ {
        include snippets/wasteland-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location / {
        include snippets/wasteland-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html /index.html;
    }
}
