# Copy to /etc/nginx/conf.d/. Limits complement the per-address counters in the database.
limit_req_zone $binary_remote_addr zone=wl_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=wl_auth:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=wl_guest:10m rate=10r/m;
limit_req_zone $uri zone=wl_poll:10m rate=1r/s;
limit_req_status 429;

# No query string and no Referer: login links carry a one-time token.
log_format wasteland '$remote_addr [$time_iso8601] "$request_method $uri" $status '
                     '$body_bytes_sent $request_time "$http_user_agent"';
